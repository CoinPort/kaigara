# Fixture for scripts/bin-test.sh. Every value here is a placeholder.
#
# This file previously held credential-shaped strings -- Vault service
# tokens in the `s.<24 chars>` format, database and SMTP passwords, an
# API key and DSNs with inline passwords. They were inherited from
# upstream and appeared to be generated rather than live, but they were
# indistinguishable from real credentials to anyone reading the repo or
# running a secret scanner over it.
#
# Keep it that way: placeholders are prefixed `example-`, and hostnames
# use `.invalid` or the generic service names the test asserts on.
secrets:
  finex:
    scopes:
      private:
        finex_database_driver: mysql
        finex_database_host: mysql-v4.core
        finex_database_port: "3306"
        finex_gotrue_pub_key: example-gotrue-pub-key
        finex_influx_host: influxdb-0.core,influxdb-1.core,influxdb-2.core
        finex_influx_port: "8086"
        finex_influx_scheme: http
        finex_key: example-finex-key
        finex_log_level: debug
        finex_mode: prod
        finex_vault_addr: http://vault.core:8200
        finex_vault_app: opendax_uat
        finex_vault_contract_address: example-contract-address
        require_quote_amount_roles: sa_maker
      public: {}
      secret:
        finex_database_name: finex_opendax_uat
        finex_database_password: example-finex-db-password
        finex_database_username: finex_opendax_uat
        finex_deployment_id: opendax_uat
        finex_influx_database: finex_opendax_uat
        finex_influx_password: example-finex-influx-password
        finex_influx_username: opendax
        finex_license_key: example-license-key
        finex_vault_broker_private_key: example-broker-private-key
        finex_vault_rpc_url: wss://rpc.example.invalid/ws/v3/example-project-id
  frontdex:
    scopes:
      private:
        next_public_chain_id: "4"
        next_public_custody_contract: example-custody-contract
      public: {}
      secret:
        next_public_infura_id: example-infura-id
  global:
    scopes:
      private: {}
      public: {}
      secret:
        database_host: 0.0.0.0
        database_port: "3306"
        postgres_host: 0.0.0.0
        postgres_port: "5432"
  gotrue:
    scopes:
      private:
        db_namespace: auth
        gotrue_api_host: 0.0.0.0
        gotrue_cookie_duration: "3600"
        gotrue_db_driver: postgres
        gotrue_jwt_algorithm: RS256
        gotrue_jwt_default_group_name: user
        gotrue_jwt_exp: "3600"
        gotrue_mailer_autoconfirm: "true"
        gotrue_mailer_urlpaths_confirmation: /verify
        gotrue_mailer_urlpaths_invite: /verify
        gotrue_mailer_urlpaths_recovery: /verify
        gotrue_operator_token: example-operator-token
        gotrue_smtp_admin_email: admin@example.invalid
        gotrue_smtp_host: smtp.example.invalid
        gotrue_smtp_pass: example-smtp-password
        gotrue_smtp_port: "25"
        gotrue_smtp_user: example-smtp-user
      public: {}
      secret:
        database_url: postgres://gotrue_odax_example:example-gotrue-db-password@postgresql.core:5432/opendax_odax_example
        gotrue_database_host: postgresql.core
        gotrue_database_name: opendax_odax_example
        gotrue_database_password: example-gotrue-db-password
        gotrue_database_username: gotrue_odax_example
        gotrue_disable_signup: "false"
        gotrue_jwt_secret: example-jwt-secret
  postgrest:
    scopes:
      private: {}
      public: {}
      secret:
        pgrst_db_host: postgresql.core
        pgrst_db_name: opendax_odax_example
        pgrst_db_pass: example-pgrst-db-password
        pgrst_db_port: "5432"
        pgrst_db_uri: postgres://postgrest_odax_example:example-pgrst-db-password@postgresql.core:5432/opendax_odax_example
        pgrst_db_username: postgrest_odax_example
  realtime:
    scopes:
      private: {}
      public: {}
      secret:
        realtime_db_host: postgresql.core
        realtime_db_name: opendax_odax_example
        realtime_db_pass: example-realtime-db-password
        realtime_db_username: realtime_odax_example
  storage:
    scopes:
      private: {}
      public: {}
      secret:
        storage_db_host: postgresql.core
        storage_db_name: opendax_odax_example
        storage_db_pass: example-storage-db-password
        storage_db_uri: postgres://storage_odax_example:example-storage-db-password@postgresql.core:5432/opendax_odax_example
        storage_db_username: storage_odax_example
  tokens:
    scopes:
      private: {}
      public: {}
      secret:
        applogicVaultToken: example-applogic-vault-token
        barongAuthzVaultToken: example-barong-authz-vault-token
        barongServerVaultToken: example-barong-server-vault-token
        electrumdBackupVaultToken: example-electrumd-backup-vault-token
        finexVaultToken: example-finex-vault-token
        hdwalletVaultToken: example-hdwallet-vault-token
        kaigaraVaultToken: example-kaigara-vault-token
        peatioCryptoVaultToken: example-peatio-crypto-vault-token
        peatioRailsVaultToken: example-peatio-rails-vault-token
        peatioUpstreamVaultToken: example-peatio-upstream-vault-token
        sonicVaultToken: example-sonic-vault-token
