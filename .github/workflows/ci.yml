name: CI

on:
  push:
    branches: ['**']
    tags: ['*']
  pull_request:

env:
  # Release artifacts are built with a current toolchain regardless of the
  # `go` directive in go.mod. The toolchain, not the directive, is what
  # determines which standard-library CVEs end up in the shipped binary.
  GO_VERSION: '1.26'

# Read-only by default. The release job widens this for itself; no other
# job needs to write to the repository.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA rather than a tag. A tag
# is mutable, and `release` below runs with `contents: write`, so a
# re-pointed tag would be able to publish binaries under our name.
jobs:
  check:
    name: Format, vet and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: Build
        run: make build

      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          # Pinned, not `latest`. golangci-lint v2 changed the config
          # schema and needs action v7+, so `latest` now resolves to a
          # release that cannot read .golangci.yml.
          version: v1.64.8
          args: --timeout=5m
        # Still advisory: forcetypeassert was just enabled and its backlog
        # has not been worked yet. Drop this line once it is clean.
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault:1.15
        env:
          VAULT_DEV_ROOT_TOKEN_ID: root-token
        ports: ['8200:8200']
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd "wget -q -O- http://127.0.0.1:8200/v1/sys/health || exit 1"
          --health-interval 5s --health-timeout 3s --health-retries 10

      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: kaigara_opendax_uat
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s --health-timeout 3s --health-retries 20

      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: kaigara_opendax_uat
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      KAIGARA_VAULT_ADDR: http://127.0.0.1:8200
      KAIGARA_VAULT_TOKEN: root-token
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '3306'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Enable the Vault transit engine
        run: |
          curl -sf -X POST -H "X-Vault-Token: root-token" \
            -d '{"type":"transit"}' \
            http://127.0.0.1:8200/v1/sys/mounts/transit

      # pkg/storage/sql asserts absolute version numbers, so it needs the
      # storage table empty. The services above are fresh per run.
      - name: Test
        run: go test -race ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # Reported for visibility; hashicorp/vault/api still pulls in
          # go-jose.v2 v2.5.1, which has no fixed release.
          govulncheck ./... || true

  release:
    name: Release
    needs: [check, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The tag name goes through the environment rather than being
      # interpolated into the script. Git permits ';', '$', '|' and
      # backticks in a ref name, so `VERSION=${{ github.ref_name }}`
      # let a crafted tag run commands in this `contents: write` job.
      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: make release VERSION="$VERSION"

      - name: Publish
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            bin/*
          generate_release_notes: true
          fail_on_unmatched_files: true
